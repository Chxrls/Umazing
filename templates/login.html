<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Umazing | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --text: #f1f5f9;
      --muted: #cbd5e1;
      --error: #f87171;
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      color: var(--text);
    }

    body {
      background: url('/assets/UmaBackground.jpg') no-repeat center center fixed;
      background-size: cover;
    }

    /* Gradient overlay for desktop */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, rgba(203, 201, 201, 1) 0%, rgba(255, 249, 249, 0) 100%);
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem;
      padding-left: 8%;
      /* Adjust left padding for the floating box */
    }

    /* Liquid glassmorphism card */
    .card {
      background: rgba(47, 54, 64, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
    }

    .logo-text {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text);
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      color: var(--text);
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.4rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 0.85rem 1rem;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
      margin-bottom: 1.5rem;
    }

    input:focus {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.3);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .error-box {
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.3);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      color: var(--error);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.85rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }

    button[type="submit"]:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    button[type="submit"]:active {
      transform: scale(0.98);
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      body {
        background-position: 70% center;
        /* Shift background so characters are in center */
      }

      body::before {
        display: none;
        /* Remove gradient */
      }

      .page {
        justify-content: center;
        padding: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <div class="logo">
        <div class="logo-icon">🐴</div>
        <span class="logo-text">Umazing Bot</span>
      </div>
      <h1>Dashboard Login</h1>
      <p class="subtitle">Sign in to access the Dashboard</p>

      {% if error %}
      <div class="error-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/login">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter Username"
          required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
          placeholder="Enter Password" required />

        <button type="submit" id="login-btn">Sign In</button>
      </form>
    </div>
  </div>
</body>

</html>
